name: Finalize v1.8.0 metadata

on:
  push:
    branches:
      - chore/release-1.8.0-metadata

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update lockfile release metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("frontend/package-lock.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = "1.8.0"
          data["packages"][""]["version"] = "1.8.0"
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Commit finalized metadata and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-v1.8.0-metadata.yml
          git add frontend/package-lock.json
          git commit -m "chore: finish v1.8.0 release metadata"
          git push

name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14", cache: pip}
      - run: pip install ruff pytest pytest-homeassistant-custom-component
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install homeassistant==2024.12.5
      - name: Import every integration module on Home Assistant 2024.12
        run: |
          python - <<'PY'
          import importlib
          import pkgutil
          import custom_components.deferred_actions as integration

          for module in pkgutil.iter_modules(integration.__path__):
              importlib.import_module(f"{integration.__name__}.{module.name}")
          PY
  frontend:
    if: github.ref == 'refs/heads/feature/timezone-selector-fields-pr9' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - name: Apply PR 9 source patch
        run: node scripts/apply-pr9.mjs
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit validated frontend output
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/src/deferred-actions-panel.ts frontend/src/timezone.ts frontend/src/timezone.test.ts frontend/src/service-selectors.ts frontend/src/service-selectors.test.ts custom_components/deferred_actions/frontend/deferred-actions-panel.js
          git diff --cached --check
          git commit -m "Improve timezone handling and service field selectors"
          git push origin HEAD:feature/timezone-selector-fields-pr9

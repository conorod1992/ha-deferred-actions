name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14", cache: pip}
      - run: pip install ruff pytest pytest-homeassistant-custom-component
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install homeassistant==2024.12.5
      - name: Import every integration module on Home Assistant 2024.12
        run: |
          python - <<'PY'
          import importlib
          import pkgutil
          import custom_components.deferred_actions as integration

          for module in pkgutil.iter_modules(integration.__path__):
              importlib.import_module(f"{integration.__name__}.{module.name}")
          PY
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit generated production bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/rebuild-frontend-bundle'
        working-directory: .
        run: |
          if git diff --quiet -- custom_components/deferred_actions/frontend/deferred-actions-panel.js; then
            echo "Bundle is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/deferred_actions/frontend/deferred-actions-panel.js
          git commit -m "Rebuild simplified frontend bundle"
          git push origin HEAD:agent/rebuild-frontend-bundle
      - name: Verify committed production bundle
        if: github.event_name != 'push' || github.ref != 'refs/heads/agent/rebuild-frontend-bundle'
        run: git diff --exit-code -- ../custom_components/deferred_actions/frontend/deferred-actions-panel.js
